SuccessEnvelope:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      type: object

MessageResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      type: object
      required: [message]
      properties:
        message:
          type: string

ErrorDetail:
  type: object
  required: [code, message]
  properties:
    code:
      type: string
    message:
      type: string

ErrorResponse:
  type: object
  required: [success, error]
  properties:
    success:
      type: boolean
      enum: [false]
    error:
      $ref: '#/ErrorDetail'

JwtErrorResponse:
  type: object
  required: [msg]
  properties:
    msg:
      type: string

HealthResponse:
  type: object
  required: [status, service]
  properties:
    status:
      type: string
      enum: [ok]
    service:
      type: string
      enum: [bowlmix-api]
